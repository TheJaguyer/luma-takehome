# Create the app at https://api.slack.com/apps → "From a manifest" → paste this.
# Local: Socket Mode on (as below). Deployed: set socket_mode_enabled: false and uncomment the
# request URLs, pointing them at https://<your host>/slack/events — or run
# `deploy/slack-manifest.sh <host>`, which does both.
#
# THE APP ICON IS NOT IN THIS FILE. A manifest cannot set it. After creating the app:
#   api.slack.com/apps → <the app> → Basic Information → Display Information → App icon
# Square, PNG or JPG, 512–2000 px. Keep the source in slack/icon/ (see its README) and set it on
# BOTH apps — dev and prod are separate Slack apps and do not share display information.
display_information:
  name: Shutter
  description: Turns shot ideas into approved, published product images.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: shutter
    always_online: true
  slash_commands:
    - command: /shots
      description: Shot ideas, image approvals, and where everything stands
      # Every verb src/bot/commands.ts routes, most-used first. `/shots help` is the canonical
      # list in the product; src/bot/commands.test.ts fails if the two ever disagree.
      usage_hint: "status | HG-002 | ideas | endpoints | export | priority | themes | style | daily | retry | health | setup | help"
      should_escape: false
      # url: https://<your host>/slack/events
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - files:read # CSV exports dropped in the channel (Flow 1)
      - files:write # contact sheets and candidates are uploaded, not linked
      - channels:history # see file drops in the review channel
      - groups:history
      - channels:read
      - groups:read
      - users:read # refuse bots and guests as approvers (Flow 0)
settings:
  event_subscriptions:
    # request_url: https://<your host>/slack/events
    bot_events:
      - member_joined_channel # the invite is the configuration (Flow 0, Step 1)
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    # request_url: https://<your host>/slack/events
    # The product typeahead in the upload form (Flows 5 and 6) is a separate payload to Slack,
    # so HTTP mode needs this URL as well as the one above. Socket Mode carries both.
    # message_menu_options_url: https://<your host>/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
